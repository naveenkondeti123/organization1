name: reusable worflow

on:
 workflow_call:
  inputs:
   service_name:
      description: "microservice name"
      requried: true
      type: string
   node-version:
      requried: true
      type: string
   environment:
      description: "target env name"
      requried: true
      type: string

jobs:
 build:
   runs-on: ubuntu-latest

   steps:
    - name: checkout sourec code
      uses: actions/checkout@v4

    - name: disply informnations
      run: |
      echo "service : ${{ inputs.service_name}}"
      echo "environment: ${{ inputs.environment}}"
      echo "branch: ${{ github.ref_name}}"

    - name: setup noode version
      uses: actions/setup-node@v3
      with:
       node-version: ${{inputs.node-version}}
      run: |
       npm install
  
 
